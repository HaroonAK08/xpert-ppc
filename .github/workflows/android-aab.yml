name: Android Play AAB

on:
  workflow_dispatch:

concurrency:
  group: android-aab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: https://xpertppc.com
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install npm dependencies
        run: npm install --include=dev

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: npx expo prebuild -p android --clean --non-interactive

      - name: Decode release keystore
        working-directory: apps/mobile/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ls -lah release.keystore
          keytool -list -keystore release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | head -20

      - name: Configure release signing
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node scripts/configure-release-signing.js

      - name: Build release App Bundle
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify release signing
        working-directory: apps/mobile/android/app/build/outputs/bundle/release
        run: |
          AAB=$(ls -1 *.aab | head -1)
          echo "Checking $AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/aab-sign.txt | tail -40
          if grep -q "CN=Android Debug" /tmp/aab-sign.txt; then
            echo "ERROR: AAB is still debug-signed"
            exit 1
          fi
          if ! grep -q "CN=XpertPPC Leads" /tmp/aab-sign.txt; then
            echo "ERROR: Expected XpertPPC Leads release certificate not found"
            exit 1
          fi
          echo "Release signing verified"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpertppc-leads-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
