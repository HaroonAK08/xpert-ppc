name: Android Play AAB

on:
  workflow_dispatch:

concurrency:
  group: android-aab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: https://xpertppc.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install npm dependencies
        run: npm ci --include=dev

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: npx expo prebuild -p android --clean --non-interactive

      - name: Build release App Bundle
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpertppc-leads-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
